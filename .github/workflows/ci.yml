name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, Test, Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Compute VSIX artifact name
        shell: bash
        run: |
          if [[ -n "${GITHUB_HEAD_REF}" ]]; then
            ref_name="${GITHUB_HEAD_REF}"
          else
            ref_name="${GITHUB_REF_NAME}"
          fi

          ref_slug="$(printf '%s' "${ref_name}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
          os_slug="$(printf '%s' "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          echo "VSIX_NAME=vscode-xunit-viewer-${ref_slug}-${os_slug}.vsix" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Package VSIX
        shell: bash
        run: bunx @vscode/vsce package -o "${VSIX_NAME}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VSIX_NAME }}
          path: ${{ env.VSIX_NAME }}
          if-no-files-found: error
