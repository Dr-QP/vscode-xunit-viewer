name: Release VSIX

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-package-release:
    name: Build, Test, Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Create tag for release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Compute release VSIX name
        shell: bash
        run: |
          release_version="$(printf '%s' "${{ github.event.release.tag_name }}" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
          os_slug="$(printf '%s' "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          echo "VSIX_NAME=vscode-xunit-viewer-${release_version}-${os_slug}.vsix" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Package VSIX
        shell: bash
        run: bunx @vscode/vsce package -o "${VSIX_NAME}"

      - name: Attach VSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VSIX_NAME }}
          fail_on_unmatched_files: true
          overwrite_files: true
