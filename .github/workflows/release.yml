name: Release VSIX

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
      release_version: ${{ steps.release-metadata.outputs.release_version }}

    steps:
      - name: Check out repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare release branch
        id: prepare-release-branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          version="${{ github.event.inputs.version }}"
          release_branch="release/v${version}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${package_version}" != "${version}" ]]; then
            git switch -C "${release_branch}"
            bun pm version "${version}"
            git push --force-with-lease --follow-tags --set-upstream origin "${release_branch}"
            echo "tag_created=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_created=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create tag for release
        if: github.event_name == 'workflow_dispatch' && steps.prepare-release-branch.outputs.tag_created != 'true'
        shell: bash
        run: |
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Compute release metadata
        id: release-metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="v${{ github.event.inputs.version }}"
          else
            release_tag="${{ github.event.release.tag_name }}"
          fi

          release_version="$(printf '%s' "${release_tag}" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

  build-test-package-release:
    name: Build, Test, Release
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Compute release VSIX name
        shell: bash
        run: |
          release_version="${{ needs.prepare-release.outputs.release_version }}"
          echo "VSIX_NAME=vscode-xunit-viewer-${release_version}.vsix" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Package VSIX
        shell: bash
        run: bun run package -o "${VSIX_NAME}"

      - name: Attach VSIX to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: ${{ env.VSIX_NAME }}
          fail_on_unmatched_files: true
          overwrite_files: true
